[package]
name = "grab-a-clip"
version = "0.1.0"
description = "GrabAClip - a simple, fast video downloader for content you are authorized to download"
authors = ["GrabAClip Contributors"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grab_a_clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "gzip", "stream"] }
url = "2"
